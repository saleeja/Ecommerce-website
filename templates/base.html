<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ site_name }} – Premium online store. Order via WhatsApp instantly." />
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="{% url 'home' %}" class="nav-logo">{{ site_name }}</a>
      <div class="nav-links">
        <!-- <a href="{% url 'home' %}">Home</a> -->
      </div>
    </div>
  </nav>

  <!-- CONTENT -->
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>© 2025 {{ site_name }} &mdash; All Rights Reserved &mdash; Order via WhatsApp 📱</p>
  </footer>

</body>
</html>
