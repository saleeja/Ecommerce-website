services:
  - type: web
    name: Papparazzo-store
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecomsite.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
